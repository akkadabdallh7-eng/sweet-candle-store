function home(){return '<section class="hero"><div><div class="eyebrow">HANDMADE • LUXURY • LOVE</div><h1>تفاصيل صغيرة<br>تصنع لحظات كبيرة.</h1><div class="goldline"></div><p>'+esc(db.message)+'</p><a class="btn" href="#shop">اكتشف المجموعة</a><a class="btn alt" href="#about">قصتنا</a></div><div class="visual"><span class="petal p1">🌿</span><div class="orb"></div><span class="petal p2">🌸</span></div></section><section class="section"><div class="head"><h2>مختاراتنا</h2><span>BEST SELLERS</span></div><div class="grid">'+P.filter(x=>x.b).slice(0,4).map(card).join('')+'</div></section><section class="section"><div class="head"><h2>تسوق حسب الفئة</h2><span>COLLECTIONS</span></div><div class="cats"><a class="cat" href="#shop/'+encodeURIComponent('شموع')+'">الشموع</a><a class="cat" href="#shop/'+encodeURIComponent('هدايا')+'">الهدايا</a><a class="cat" href="#shop/'+encodeURIComponent('زهور')+'">الزهور</a></div></section><section class="story section"><div><div class="eyebrow">OUR STORY</div><h2 style="font:500 48px Georgia">صُنع بحب، ليُهدى بحب.</h2><p>نؤمن أن الهدية الجميلة ليست شيئاً يُشترى فقط، بل إحساس يبقى. لذلك صممنا كل قطعة بروح يدوية وتفاصيل هادئة.</p></div><div class="quote">“أحياناً تكفي شمعة صغيرة لتجعل المكان يحمل ذكرى كبيرة.”</div></section>';}
function shop(c){const a=c?P.filter(x=>x.c===c):P;return '<section class="section"><div class="head"><h2>'+esc(c||'المجموعة كاملة')+'</h2><span>'+a.length+' PRODUCTS</span></div><div class="grid">'+a.map(card).join('')+'</div></section>';}
function product(id){const p=P.find(x=>String(x.id)===String(id));if(!p)return '<div class="empty">المنتج غير موجود</div>';temp=1;return '<section class="product"><div class="bigpic">'+visual(p.i)+'</div><div><div class="eyebrow">'+esc(p.c.toUpperCase())+'</div><h1>'+esc(p.n)+'</h1><div class="price">'+money(p.p)+'</div><p class="muted">'+esc(p.d)+'</p><p>'+(p.s?'متوفر حالياً':'غير متوفر')+'</p><div class="qty"><button onclick="temp=Math.max(1,temp-1);$(\'#q\').textContent=temp">−</button><b id="q">1</b><button onclick="temp=Math.min('+Math.max(1,p.s)+',temp+1);$(\'#q\').textContent=temp">+</button></div><button class="btn" onclick="add(\''+esc(p.id)+'\',temp)" '+(!p.s?'disabled':'')+'>أضف إلى السلة</button><button class="btn alt" onclick="wishIt(\''+esc(p.id)+'\')">♡ المفضلة</button></div></section>';}
function add(id,q){sync();const p=P.find(x=>String(x.id)===String(id));if(!p||!p.s)return;let x=cart.find(x=>String(x.id)===String(id));const n=Math.max(1,Number(q)||1);if(x)x.q=Math.min(p.s,x.q+n);else cart.push({id:p.id,q:Math.min(p.s,n)});saveCart();alert('تمت إضافة المنتج إلى السلة');}
function wishIt(id){id=String(id);wish=wish.includes(id)?wish.filter(x=>String(x)!==id):wish.concat(id);saveCart();render();}
function cartPage(){sync();const a=cart.map(x=>({...x,p:P.find(p=>String(p.id)===String(x.id))})).filter(x=>x.p);const total=a.reduce((z,x)=>z+x.p.p*x.q,0);return '<section class="section"><div class="head"><h2>سلة المشتريات</h2></div>'+(a.length?a.map(x=>'<div class="summary" style="margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center"><span>'+visual(x.p.i)+' '+esc(x.p.n)+' × '+x.q+'</span><b>'+money(x.p.p*x.q)+'</b><button onclick="cart=cart.filter(y=>String(y.id)!==String(\''+esc(x.id)+'\'));saveCart();render()">حذف</button></div>').join('')+'<div class="summary" style="margin-top:20px"><b>الإجمالي '+money(total)+'</b><br><a class="btn" href="#checkout">إتمام الطلب</a></div>':'<div class="empty">السلة فارغة</div>')+'</section>';}
function checkout(){sync();const total=cart.reduce((z,x)=>{const p=P.find(p=>String(p.id)===String(x.id));return z+(p?p.p*x.q:0)},0);const shipping=Number(db.shipping_syp||db.shipping||0);const grand=total+shipping;const pays=db.payments||{};return '<section class="section"><div class="head"><h2>إتمام الطلب</h2></div><div class="summary"><input class="field" id="name" placeholder="الاسم الكامل"><input class="field" id="phone" placeholder="رقم الهاتف"><input class="field" id="address" placeholder="العنوان"><select class="field" id="pay"><option '+(pays.enabled===false?'disabled ':'')+'>MTN CASH</option><option '+(pays.enabled===false?'disabled ':'')+'>SYRIATEL CASH</option><option '+(pays.enabled===false?'disabled ':'')+'>SHAM CASH</option><option>CASH ON DELIVERY</option></select><div id="paymentHint" class="muted" style="margin:8px 0">اختر طريقة الدفع لرؤية رقم الحساب.</div><div id="proofWrap"><label style="display:block;margin:10px 0 6px;font-weight:700">📷 أرسل صورة الدفع</label><input class="field" id="paymentProof" type="file" accept="image/*"><div id="proofPreview" class="muted" style="font-size:12px">اختر صورة إيصال الدفع من معرض الهاتف</div></div><div style="margin-top:18px;line-height:2"><div>قيمة المنتجات: <b>'+money(total)+'</b></div><div>الشحن: <b>'+money(shipping)+'</b></div><h3>الإجمالي: '+money(grand)+'</h3></div><button class="btn" onclick="order()">تأكيد الطلب</button></div></section>';}
async function order(){sync();if(!cart.length){location.hash="#cart";return;}const name=(document.querySelector("#name")?.value||"").trim();const phone=(document.querySelector("#phone")?.value||"").trim();const address=(document.querySelector("#address")?.value||"").trim();const payment=document.querySelector("#pay")?.value||"CASH ON DELIVERY";const file=document.querySelector("#paymentProof")?.files?.[0]||null;if(!name||!phone||!address){alert("يرجى تعبئة الاسم ورقم الهاتف والعنوان.");return;}if(payment!=="CASH ON DELIVERY"&&!file){alert("يرجى إرفاق صورة الدفع أولاً.");return;}if(file&&( !file.type.startsWith("image/") || file.size>5*1024*1024)){alert(file.size>5*1024*1024?"الصورة يجب أن تكون أقل من 5MB.":"نوع الملف غير مدعوم.");return;}const items=cart.map(x=>({id:String(x.id),q:Number(x.q||0)}));const btn=document.querySelector('button[onclick="order()"]');if(btn){btn.disabled=true;btn.textContent="جاري تأكيد الطلب...";}try{if(!window.SCC_SUPABASE)throw new Error("Supabase غير مهيأ");let proofUrl="";if(payment!=="CASH ON DELIVERY"&&file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path='proof-'+Date.now()+'-'+Math.random().toString(36).slice(2,9)+'.'+ext;const up=await window.SCC_SUPABASE.storage.from('payment-proofs').upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw new Error('تعذر رفع صورة الدفع: '+up.error.message);const pub=window.SCC_SUPABASE.storage.from('payment-proofs').getPublicUrl(path);proofUrl=pub?.data?.publicUrl||"";if(!proofUrl)throw new Error("تعذر الحصول على رابط صورة الدفع");}const r=await window.SCC_SUPABASE.rpc("create_store_order",{p_order:{customer:name,phone,address,payment,payment_proof_url:proofUrl,items}});if(r.error)throw r.error;const result=r.data;const id=result?.id||result?.order_id;if(!id)throw new Error("لم يتم استلام رقم الطلب من الخادم");if(result?.state){db=result.state;localStorage.setItem(DBKEY,JSON.stringify(db));}localStorage.setItem("sccOrder",JSON.stringify({id}));cart=[];saveCart();await window.SCC_HYDRATE_STATE();location.hash="#success/"+encodeURIComponent(id);}catch(e){console.error(e);alert("تعذر إنشاء الطلب: "+(e?.message||"تحقق من إعداد Supabase"));if(btn){btn.disabled=false;btn.textContent="تأكيد الطلب";}}}
function success(id){return '<div class="empty"><div style="font-size:75px">✦</div><h1>تم استلام طلبك</h1><p>رقم الطلب</p><h2>'+esc(id)+'</h2><a class="btn" href="#track/'+encodeURIComponent(id)+'">تتبع الطلب</a><a class="btn alt" href="#shop">متابعة التسوق</a></div>';}
function track(id){db=readDB();const o=(db.orders||[]).find(x=>String(x.id)===String(id));const states=['Order Received','Payment Verification','Preparing','Ready for Delivery','Out for Delivery','Delivered'];const idx=o?Math.max(0,states.indexOf(o.status)):-1;return '<section class="section"><div class="head"><h2>تتبع الطلب</h2></div><input class="field" id="tr" placeholder="SC123456" value="'+esc(id||'')+'"><button class="btn" onclick="location.hash=\'#track/\'+encodeURIComponent($(\'#tr\').value)">بحث</button>'+(o?'<div class="summary" style="margin-top:25px"><h3>'+esc(o.id)+'</h3><div class="steps">'+['استلام الطلب','تدقيق الدفع','قيد التحضير','جاهز للتوصيل','خرج للتوصيل','تم التسليم'].map((x,i)=>'<div class="step '+(i<=idx?'done':'')+'">'+x+'</div>').join('')+'</div></div>':'')+'</section>';}
function search(){document.body.insertAdjacentHTML('beforeend','<div class="search" onclick="if(event.target===this)this.remove()"><div class="searchbox"><input autofocus placeholder="ابحث عن منتج..." oninput="sr(this.value)"><div id="sr"></div></div></div>');}
function sr(q){const a=P.filter(p=>(p.n+' '+p.e+' '+p.c).toLowerCase().includes(String(q||'').toLowerCase()));const el=$('#sr');if(el)el.innerHTML=a.map(p=>'<p><a href="#product/'+encodeURIComponent(p.id)+'" onclick="document.querySelector(\'.search\')?.remove()">'+visual(p.i)+' '+esc(p.n)+' — $'+p.p+'</a></p>').join('');}
function aboutPage(){return '<section class="story section"><div><div class="eyebrow">OUR STORY</div><h2 style="font:500 48px Georgia">صُنع بحب، ليُهدى بحب.</h2><p>نؤمن أن الهدية الجميلة ليست شيئاً يُشترى فقط، بل إحساس يبقى. لذلك صممنا كل قطعة بروح يدوية وتفاصيل هادئة.</p></div><div class="quote">“أحياناً تكفي شمعة صغيرة لتجعل المكان يحمل ذكرى كبيرة.”</div></section>';}
function render(){sync();count();const h=location.hash.slice(1)||'home';const parts=h.split('/');const path=parts[0];const param=decodeURIComponent(parts.slice(1).join('/')||'');let out;if(path==='home')out=home();else if(path==='shop')out=shop(param);else if(path==='candles')out=shop('شموع');else if(path==='gifts')out=shop('هدايا');else if(path==='flowers')out=shop('زهور');else if(path==='product')out=product(param);else if(path==='cart')out=cartPage();else if(path==='checkout')out=checkout();else if(path==='wishlist')out='<section class="section"><div class="head"><h2>المفضلة</h2></div><div class="grid">'+P.filter(p=>wish.map(String).includes(String(p.id))).map(card).join('')+(P.filter(p=>wish.map(String).includes(String(p.id))).length?'':'<div class="empty">لا توجد منتجات</div>')+'</div></section>';else if(path==='about')out=aboutPage();else if(path==='track')out=track(param);else if(path==='success')out=success(param);else out='<div class="empty">الصفحة غير موجودة</div>';const app=$('#app');if(app)app.innerHTML=out;applyVisitorLanguage();}

</script><script>window.addEventListener("load",()=>window.SCC_HYDRATE_STATE&&window.SCC_HYDRATE_STATE());</script><script>document.addEventListener('change',e=>{if(e.target&&e.target.id==='pay'){const p=db.payments||{};const map={'MTN CASH':p.mtn||'','SYRIATEL CASH':p.syr||'','SHAM CASH':p.sham||''};const hint=document.getElementById('paymentHint');const wrap=document.getElementById('proofWrap');if(hint)hint.textContent=e.target.value==='CASH ON DELIVERY'?'الدفع عند الاستلام — لا تحتاج صورة دفع.':'رقم الحساب: '+(map[e.target.value]||'غير مضبوط من الإدارة');if(wrap)wrap.style.display=e.target.value==='CASH ON DELIVERY'?'none':'block';}if(e.target&&e.target.id==='paymentProof'){const file=e.target.files?.[0];const preview=document.getElementById('proofPreview');if(file&&preview){preview.textContent='تم اختيار صورة الدفع: '+file.name;preview.style.color='var(--brown)';}}});setInterval(()=>window.SCC_HYDRATE_STATE&&window.SCC_HYDRATE_STATE(),5000);</script></body></html>
